# Consultas textuais para GET /api/search/?q=...
# Distinto de terms.yaml (regex local). Aqui são frases enviadas ao índice do portal.
# Versionado. Ampliação exige revisão humana.
#
# Não incluir siglas isoladas (IA, AI, RPA) — ruído alto no buscador.
# Não incluir guarda-chuvas que o índice parte em palavras soltas
# (ciência/data science, mineração de dados, análise preditiva, grafia repetida).

schema_version: 1

# Tipos pedíveis ao portal (campo tipos_documento).
# O corpus do artigo usa só contrato (D018); a busca restringe-se a esse tipo.
document_types:
  - contrato

queries:
  - id: inteligencia_artificial
    q: "inteligencia artificial"
    notes: Forma sem acento; o índice trata a variante acentuada como a mesma busca.
